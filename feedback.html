<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Star Motors | Feedback</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Speed Star Motors</h1>
        </div> 
        <nav>
            <nav>
                <ul>
                  <li><a href="index.html">Home</a></li>
                  <li><a href="contactus.html">Contact Us</a></li>
                  <li><a href="aboutus.html">About Us</a></li>
                  <li><a href="services.html">Services</a></li>
                  <li><a href="feedback.html">Feedback</a></li>
                  <li><a href="products.html">Product</a></li>
                </ul>
            </nav>
    </header>
    <section class="container">
        <form id="form" action="index.html" method="post" onsubmit="return validateForm()">
            <div>
                <label>Name
                    <input type="text" name="name" placeholder="Name" id="name" required>
                </label>
                <span id="nameError" class="error"></span>
            </div>
            <div>
                <label>Email
                    <input type="email" name="Email" id="email" placeholder="Email" required>
                </label>
                <span id="emailError" class="error"></span>
            </div>
            <div>
                <label>Feedback
                    <input type="text" name="feedback" placeholder="Feedback" id="feedback" required>
                </label>
                <span id="feedbackError" class="error"></span>
            </div>
            <div>
                <button type="submit">Submit</button>
            </div>
        </form>
        <h3>We appreciate your honest feedback. It helps us grow and serve you better.</h3>
        
        <script>
            function validateForm() {
                let isValid = true;
                
                let name = document.getElementById("name").value.trim();
                let email = document.getElementById("email").value.trim();
                let feedback = document.getElementById("feedback").value.trim();
                
                let nameError = document.getElementById("nameError");
                let emailError = document.getElementById("emailError");
                let feedbackError = document.getElementById("feedbackError");
                
                nameError.textContent = "";
                emailError.textContent = "";
                feedbackError.textContent = "";
                
                let namePattern = /^[A-Za-z\s]+$/;
                if (name.length < 3 || !namePattern.test(name)) {
                    nameError.textContent = "Name must be at least 3 characters long and contain only letters";
                    isValid = false;
                }
                
                let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(email)) {
                    emailError.textContent = "Enter a valid email address";
                    isValid = false;
                }
                
                if (feedback.length < 10) {
                    feedbackError.textContent = "Feedback must be at least 10 characters long";
                    isValid = false;
                }
                
                return isValid;
            }
        </script>
    </section>
    <footer>
        <p>&copy; 2025 Speed Star Motors. All rights reserved</p>
    </footer>
</body>
</html>
